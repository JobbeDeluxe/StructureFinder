name: StructureFinder
version: 1.0.0
main: de.unlimited8.structurefinder.StructureFinder
api-version: '26.3'
author: unlimited8
description: Struktur-Suche um Online-Spieler mit GUI und RCON
commands:
  structures:
    description: Suche Strukturen um einen Spieler
    usage: /structures [players|types|find|results|tp|cancel]
    aliases: [structfind]
permissions:
  structurefinder.use:
    description: Darf die Struktur-Menues verwenden
    default: op
  structurefinder.admin:
    description: Darf Struktur-Suchen und Teleports fuer andere Spieler ausloesen
    default: op
